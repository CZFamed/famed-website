name: 部署到 Cloudflare Workers

# push 到 main 就自动部署 czfamed.czfamed1.workers.dev
# 也可以在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # wrangler 4 要求 Node >= 22
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 拦下"图标/样式引用指向不存在的资源"这类静默损坏
      - name: 站点完整性检查
        run: node tools/check_site.mjs

      # 没配凭据时给出可操作的报错，而不是让 wrangler 抛一句难懂的认证失败
      - name: 检查 Cloudflare 凭据
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::仓库缺少 secret：$missing。请到 Settings → Secrets and variables → Actions 添加后重新运行本工作流（步骤见 README §十）。"
            exit 1
          fi
          echo "凭据已配置"

      - name: 部署
        run: npx --yes wrangler@4.131.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: 站点完整性检查

# 说明：线上部署由 Cloudflare 的 Git 集成（Workers Builds）负责，每次 push 自动构建。
# 这个工作流只做两件事：push 后跑一遍完整性检查；如果仓库配了 Cloudflare 凭据，
# 再额外来一次 wrangler deploy 作为备用路径（没配就跳过，不会报错）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # wrangler 4 要求 Node >= 22
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 拦下"图标/样式引用指向不存在的资源"这类静默损坏
      - name: 站点完整性检查
        run: node tools/check_site.mjs

      - name: 判断是否需要本工作流部署
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过 GitHub Actions 部署；线上由 Cloudflare Workers Builds（Git 集成）自动部署，无需处理。"
          fi

      - name: 部署（可选后备路径）
        if: steps.creds.outputs.ready == 'true'
        run: npx --yes wrangler@4.131.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
